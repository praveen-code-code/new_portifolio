services:
  - type: web
    name: dr-ali-portfolio
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        value: drali-secret-key-2024
      - key: DATABASE_URL
        fromDatabase:
          name: dr-ali-db
          property: connectionString

databases:
  - name: dr-ali-db